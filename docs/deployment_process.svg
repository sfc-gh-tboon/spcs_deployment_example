<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1740" viewBox="0 0 1200 1740" role="img" aria-label="SPCS writeback service deployment flow chart"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1A3E5C"/></marker></defs><style>text{font-family:Arial,sans-serif}.phase{font-size:14px;font-weight:bold;fill:#1A3E5C}.name{font-size:15px;font-weight:bold;fill:white}.detail{font-size:12px;fill:white}.role{font-size:11px;fill:white}.edge{stroke:#1A3E5C;stroke-width:2;marker-end:url(#arrow)}.edge-label{font-size:11px;fill:#1A3E5C;text-anchor:start}</style><rect x="90" y="30" width="1020" height="58" rx="7" fill="#1A3E5C"/><text x="114" y="66" fill="white" font-size="20" font-weight="bold">SPCS WRITEBACK SERVICE DEPLOYMENT  |  October 2026</text><rect x="150" y="110" width="900" height="125" rx="8" fill="#FFF3E0" stroke="#FF9800"/><rect x="150" y="255" width="900" height="550" rx="8" fill="#E8F4FD" stroke="#1A3E5C"/><rect x="150" y="825" width="900" height="230" rx="8" fill="#E8F4FD" stroke="#29B5E8"/><rect x="150" y="1075" width="900" height="230" rx="8" fill="#E8F4FD" stroke="#118FBB"/><rect x="150" y="1325" width="900" height="125" rx="8" fill="#E8F5E9" stroke="#4CAF50"/><rect x="150" y="1470" width="900" height="135" rx="8" fill="#E8F5E9" stroke="#4CAF50"/><g class="phase"><text x="170" y="135">01  CONFIGURATION</text><text x="170" y="280">02  INFRASTRUCTURE  |  STEPS 1–5</text><text x="170" y="850">03  BUILD  |  STEPS 6–7</text><text x="170" y="1100">04  DEPLOY  |  STEPS 8–9</text><text x="170" y="1350">05  VALIDATION  |  STEP 10</text><text x="170" y="1495">06  RESULT</text></g><g fill="none" class="edge"><path d="M600 217 V284"/><path d="M600 350 V394"/><path d="M600 460 V504"/><path d="M600 570 V614"/><path d="M600 680 V724"/><path d="M600 790 V854"/><path d="M600 920 V964"/><path d="M600 1030 V1099"/><path d="M600 1177 V1209"/><path d="M600 1287 V1354"/><path d="M600 1432 V1504"/></g><g class="edge-label"><text x="610" y="252">configure</text><text x="610" y="378">provision</text><text x="610" y="488">ACTIVE</text><text x="610" y="598">configure egress</text><text x="610" y="708">authorize</text><text x="610" y="830">build</text><text x="610" y="948">publish</text><text x="610" y="1072">deploy image</text><text x="610" y="1196">READY</text><text x="610" y="1321">validate</text><text x="610" y="1465">tests pass</text></g><g stroke="#1A3E5C" stroke-width="1"><rect x="320" y="145" width="560" height="72" rx="9" fill="#FF9800"/><rect x="320" y="290" width="560" height="60" rx="9" fill="#1A3E5C"/><rect x="320" y="400" width="560" height="60" rx="9" fill="#1A3E5C"/><rect x="320" y="510" width="560" height="60" rx="9" fill="#1A3E5C"/><rect x="320" y="620" width="560" height="60" rx="9" fill="#1A3E5C"/><rect x="320" y="730" width="560" height="60" rx="9" fill="#1A3E5C"/><rect x="320" y="860" width="560" height="60" rx="9" fill="#29B5E8"/><rect x="320" y="970" width="560" height="60" rx="9" fill="#29B5E8"/><rect x="320" y="1105" width="560" height="72" rx="9" fill="#118FBB"/><rect x="320" y="1215" width="560" height="72" rx="9" fill="#118FBB"/><rect x="320" y="1360" width="560" height="72" rx="9" fill="#4CAF50"/><rect x="320" y="1510" width="560" height="78" rx="9" fill="#4CAF50"/></g><g text-anchor="middle"><text class="name" x="600" y="169">config.ps1</text><text class="detail" x="600" y="187">Prompts: service name, connection, roles, writeback targets, debug mode</text><text class="role" x="600" y="204">Role: configured interactively</text><text class="name" x="600" y="315">Step 1: Create Image Repository</text><text class="role" x="600" y="335">Role: ROLE</text><text class="name" x="600" y="425">Step 2: Create Compute Pool + wait for ACTIVE</text><text class="role" x="600" y="445">Role: ROLE</text><text class="name" x="600" y="535">Step 3: Create Network Rule for egress</text><text class="role" x="600" y="555">Role: ROLE</text><text class="name" x="600" y="645">Step 4: Create Secret</text><text class="role" x="600" y="665">Role: ROLE</text><text class="name" x="600" y="755">Step 5: Create External Access Integration</text><text class="role" x="600" y="775">Role: ADMIN_ROLE</text><text class="name" x="600" y="885">Step 6: Docker Build (linux/amd64)</text><text class="role" x="600" y="905">Role: local Docker environment</text><text class="name" x="600" y="995">Step 7: Push Image to Snowflake Registry</text><text class="role" x="600" y="1015">Role: registry-authenticated connection</text><text class="name" x="600" y="1128">Step 8: Create SPCS Service</text><text class="detail" x="600" y="1148">Substitute template placeholders; generate service.yaml</text><text class="role" x="600" y="1165">Role: SERVICE_ROLE</text><text class="name" x="600" y="1238">Step 9: Wait for READY, Create Service Function</text><text class="detail" x="600" y="1258">Grant to SERVICE_ROLE</text><text class="role" x="600" y="1275">Role: ROLE</text><text class="name" x="600" y="1384">Step 10: Run Tests</text><text class="detail" x="600" y="1403">Missing productCode · valid productCode · batch</text><text class="role" x="600" y="1420">Role: configured test connection</text><text class="name" x="600" y="1534">Service Live</text><text class="detail" x="600" y="1555">SELECT ROUTE_&lt;NAME&gt;_WRITEBACK(...);</text><text class="role" x="600" y="1575">Role: SERVICE_ROLE (granted usage)</text></g><rect x="820" y="1620" width="290" height="98" rx="7" fill="#E8F4FD" stroke="#1A3E5C"/><g fill="#1A3E5C" font-size="12"><text x="832" y="1640" font-weight="bold">LEGEND</text><text x="832" y="1658">Orange: configuration</text><text x="832" y="1675">Dark blue: infrastructure</text><text x="832" y="1692">Blue: build / deploy</text><text x="832" y="1709">Green: validation / live</text></g></svg>