# SPCS Service Specification Template
# ====================================
# This file is read by step_08_service.ps1 at deployment time.
# Placeholders ({{...}}) are replaced automatically with values from config.ps1.
#
# To customize: edit this file directly. The deployment script will substitute
# the placeholders and pass the resolved spec to CREATE SERVICE.
#
# Available placeholders:
#   {{IMAGE}}              - Full image path (registry/db/schema/repo/image:tag)
#   {{DB}}                 - Database name
#   {{SCHEMA}}             - Schema name
#   {{CONTAINER_NAME}}     - Container name (derived from service name)
#   {{ENDPOINT_NAME}}      - Endpoint name and FastAPI route path (default: route)
#   {{WRITEBACK_DB_NAME}}  - Database containing the writeback stored procedures
#   {{WRITEBACK_SCHEMA_NAME}} - Schema containing the writeback stored procedures
#   {{WRITEBACK_WAREHOUSE}}   - Warehouse used for writeback procedure calls
#   {{DEBUG_MODE}}            - Set to "true" for verbose debug logging (default: "false")
#
# After deployment, the resolved spec is saved to service.yaml for reference.

spec:
  containers:
    - name: "{{CONTAINER_NAME}}"
      image: "{{IMAGE}}"
      env:
        WRITEBACK_DB_NAME: "{{WRITEBACK_DB_NAME}}"
        WRITEBACK_SCHEMA_NAME: "{{WRITEBACK_SCHEMA_NAME}}"
        WRITEBACK_WAREHOUSE: "{{WRITEBACK_WAREHOUSE}}"
        DEBUG_MODE: "{{DEBUG_MODE}}"
      resources:
        requests:
          cpu: "0.5"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      readinessProbe:
        port: 8000
        path: /
  endpoints:
    - name: "{{ENDPOINT_NAME}}"
      port: 8000
      public: false
